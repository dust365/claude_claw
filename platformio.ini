; AI Status - PlatformIO Configuration
; ESP32-C6 + 1.47" ST7789 Display

[env:esp32c6]
platform = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF53
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800
; Don't pin upload_port — macOS renames the ESP32-C6 USB CDC port after every
; reset (101 → 832xx ...). Let PIO auto-detect each time.

build_flags =
    -std=c++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    SPI
    moononournation/GFX Library for Arduino@^1.4.9
    bblanchon/ArduinoJson@^7.0.4
    WiFi
    WebServer
    ESPmDNS
    Preferences
